# Ajustes do ASUS Vivobook S14 (S3407CA) + identidade visual Arch Linux
# Carregado no fim do hyprland.conf: valores aqui sobrescrevem o padrão.

# Tela 14" 1920x1200 — escala 1.25 (1536x960 lógicos). Use 1 se preferir mais espaço.
monitor = eDP-1, 1920x1200@60, 0x0, 1.25

xwayland {
    force_zero_scaling = true
}

input {
    kb_layout = br
    touchpad {
        natural_scroll = true
        tap-to-click = true
        disable_while_typing = true
    }
}

# Paleta Arch: azul #1793D1 sobre grafite
general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(1793d1ff) rgba(4fb3e8ff) 45deg
    col.inactive_border = rgba(333c43aa)
}

decoration {
    rounding = 6
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = rgb(101418)
}

exec-once = swaybg -m fill -i @WALLPAPER@
exec-once = waybar
exec-once = mako
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = hypridle
exec-once = systemctl --user start hyprpolkitagent
# Avisos da configuração automática de Secure Boot/TPM (se houver pendência)
exec-once = sh -c 'sleep 4; [ -s /run/vivobook-status ] && notify-send -u critical "Secure Boot / TPM" "$(cat /run/vivobook-status)"'

# Bloquear tela
bind = SUPER, L, exec, loginctl lock-session
# Captura de área para a área de transferência
bind = , Print, exec, grim -g "$(slurp)" - | wl-copy
