# Guarda o caminho do sistema montado para o gui.sh continuar depois que o
# Calamares fechar (o módulo umount não é usado, então tudo segue montado).
---
dontChroot: true
timeout: 30
verbose: false
script:
  - "printf '%s' '${ROOT}' > /run/arch-install-root"
  - "touch /run/arch-install-calamares-ok"
