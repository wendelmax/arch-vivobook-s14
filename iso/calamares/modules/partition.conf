# Partição do instalador gráfico: mesmo layout do install.sh.
# ESP de 1 GiB em /efi + o resto do disco em LUKS2 (Btrfs criado pelo mount).
---
efi:
  mountPoint: "/efi"
  recommendedSize: 1024MiB
  minimumSize: 512MiB
  label: "EFI"

# Sem swap de partição/arquivo: o sistema usa zram (zram-generator).
userSwapChoices:
  - none

# LUKS2, já marcado por padrão. O TPM2 é registrado depois, no primeiro boot.
luksGeneration: luks2
enableLuksAutomatedPartitioning: true
preCheckEncryption: true

lvm:
  enable: false

# Mantém o fluxo simples: apagar o disco e usar o layout do projeto.
allowManualPartitioning: false
showNotEncryptedBootMessage: false
initialPartitioningChoice: erase
initialSwapChoice: none

defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs"]
requiredStorage: 20
