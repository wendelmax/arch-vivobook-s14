# Usuário/senhas/hostname do instalador gráfico.
# O grupo wheel dá sudo (igual ao install.sh) e as senhas seguem o padrão
# permissivo do projeto (o usuário escolhe a força da senha).
---
defaultGroups:
  - name: users
    must_exist: true
    system: true
  - lp
  - video
  - storage
  - name: wheel
    must_exist: false
    system: true
  - audio

autologinGroup: autologin
sudoersGroup: wheel
sudoersConfigureWithGroup: true

setRootPassword: true
doReusePassword: true
displayAutologin: false
doAutologin: false

passwordRequirements:
  minLength: -1
  maxLength: -1
  libpwquality:
    - minlen=0
    - minclass=0
allowWeakPasswords: true
allowWeakPasswordsDefault: true

user:
  shell: /bin/bash
  forbidden_names: [root]
  home_permissions: "o700"

hostname:
  location: EtcFile
  writeHostsFile: true
  template: "archlinux"
  forbidden_names: [localhost]
