# Teclado: grava /etc/vconsole.conf (KEYMAP) e a configuração do Xorg.
# convertedKeymapPath vazio faz o Calamares usar o mapa legacy (br-abnt2).
---
xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: ""
writeEtcDefaultKeyboard: false
useLocale1: false
guessLayout: true

configure:
  kwin: false
