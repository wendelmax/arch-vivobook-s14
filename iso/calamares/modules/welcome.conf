# Página inicial do Calamares: exige disco, RAM, internet e root.
# A internet já foi verificada/conectada pelo auto.sh antes de abrir a GUI.
---
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

requirements:
  requiredStorage: 20.0
  requiredRam: 2.0
  internetCheckUrl: https://archlinux.org/
  check:
    - storage
    - ram
    - internet
    - root
  required:
    - storage
    - ram
    - internet
    - root

geoip:
  style: "none"
  url: "https://geoip.kde.org/v1/ubiquity"
  selector: "CountryCode"
