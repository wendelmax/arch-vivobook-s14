# Configuração do instalador gráfico (Calamares) do projeto.
#
# O Calamares cuida só do que é interativo: disco/LUKS, usuário/senhas,
# hostname, idioma/fuso e teclado. A base do sistema é instalada por
# calamares-pacstrap.sh; fstab, initramfs/UKI, systemd-boot e serviços são
# configurados por calamares-target.sh. As etapas próprias do projeto
# (Plymouth, Hyprland, kernel, Secure Boot/TPM) rodam depois, no gui.sh.
---
modules-search: [ local ]

instances:
  - id: pacstrap
    module: shellprocess
    config: shellprocess-pacstrap.conf
  - id: system
    module: shellprocess
    config: shellprocess-system.conf
  - id: record
    module: shellprocess
    config: shellprocess-record.conf

sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - shellprocess@pacstrap
      - machineid
      - locale
      - keyboard
      - localecfg
      - hwclock
      - users
      - shellprocess@system
      - shellprocess@record
  - show:
      - finished

branding: archlinux
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
